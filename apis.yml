- aid: jina-ai:jina-ai-batch-embeddings-api
  name: Jina AI Batch Embeddings API
  description: >-
    Asynchronous embedding for large workloads: up to 50,000 inputs from a GCS file URL, or 10,000 inline.


    Submit with `POST /v1/batch/embeddings`, poll `GET /v1/batch/{batch_id}` until the status is `completed`,
    then fetch `GET /v1/batch/{batch_id}/output`. Input is OpenAI-compatible JSONL with `custom_id` and
    `body.input`. Output files expire after 24 hours, and a webhook can be called on completion.
  humanURL: https://jina.ai/embeddings/
  baseURL: https://api.jina.ai/v1
  tags:
  - Batch Embeddings
  properties:
  - type: OpenAPI
    url: openapi/jina-ai-batch-embeddings-api-openapi.yml
  - type: Documentation
    url: https://docs.jina.ai/
  - type: Documentation
    url: https://jina.ai/reader/
- aid: jina-ai:jina-ai-generative-models-api
  name: Jina AI Generative Models API
  description: >-
    Document transcription over the OpenAI chat completions schema. Point any OpenAI-compatible client
    at the server URL above with `/v1` appended, set `model`, and send a page image; the response is the
    page as text or markdown, tables and layout preserved.


    `stream: true` returns server-sent events. `response_format` with a `json_schema` constrains the output
    to that schema instead of prose. Parameters outside the supported set are accepted and ignored rather
    than rejected, so an SDK-generated payload always works.
  humanURL: https://jina.ai/embeddings/
  baseURL: https://api.jina.ai/v1
  tags:
  - Generative Models
  properties:
  - type: OpenAPI
    url: openapi/jina-ai-generative-models-api-openapi.yml
  - type: Documentation
    url: https://docs.jina.ai/
  - type: Documentation
    url: https://jina.ai/reader/
- aid: jina-ai:jina-ai-model-list-api
  name: Jina AI Model List API
  description: >-
    Every model this API serves, in OpenRouter-compatible form: identifiers, input and output modalities,
    context lengths and prices. Read it before hardcoding a model name — the catalogue moves.
  humanURL: https://jina.ai/embeddings/
  baseURL: https://api.jina.ai/v1
  tags:
