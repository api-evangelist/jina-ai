components:
  schemas:
    BatchStats:
      properties:
        total:
          type: integer
          title: Total
          description: Total number of input lines.
        completed:
          type: integer
          title: Completed
          description: Number of successfully processed lines.
          default: 0
        failed:
          type: integer
          title: Failed
          description: Number of failed lines.
          default: 0
        total_tokens:
          type: integer
          title: Total Tokens
          description: Total tokens consumed across all processed lines.
          default: 0
      type: object
      required:
      - total
      title: BatchStats
      description: Statistics for a batch job.
    BatchEmbeddingRequest:
      properties:
        model:
          type: string
          enum:
          - jina-embeddings-v5-text-nano
          - jina-embeddings-v5-text-small
          title: Model
          description: The embedding model to use for batch processing.
        input_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Url
          description: URL to input JSONL file (GCS, S3, or HTTP). Either input_url or input must be provided.
        input:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Input
          description: Inline JSONL lines for small batches. Either input_url or input must be provided.
        task:
          anyOf:
          - type: string
          - type: 'null'
          title: Task
          description: 'Task optimization: retrieval, text-matching, clustering, or classification.'
          default: text-matching
        dimensions:
          anyOf:
          - type: integer
            maximum: 1024
            exclusiveMinimum: 0
          - type: 'null'
          title: Dimensions
          description: Number of dimensions for output embeddings (1-1024).
        normalized:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Normalized
          description: If true (default), embeddings are L2-normalized to unit length.
          default: true
        webhook_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Webhook Url
          description: URL to POST notification when job completes.
      type: object
      required:
      - model
      title: BatchEmbeddingRequest
      description: Request to create a batch embedding job.
      examples:
      - dimensions: 512
        input_url: gs://my-bucket/inputs.jsonl
        model: jina-embeddings-v5-text-small
        task: retrieval
      - input:
        - body:
            input: Hello world
          custom_id: req-1
        - body:
            input: Batch embeddings
          custom_id: req-2
        model: jina-embeddings-v5-text-nano
        task: text-matching
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Human-readable error message.
          examples:
          - Invalid API key. Verify your API key at https://jina.ai/api-dashboard/key-manager or generate a new one.
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
          description: Machine-readable error code, for programmatic handling.
          examples:
          - AUTH_INVALID_API_KEY
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Identifier for this request, quote it in support requests.
          examples:
          - 03f58cd9da22fabf
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/FieldError'
            type: array
          - type: 'null'
          title: Errors
          description: Per-field detail. Present on 422 only; `detail` summarises it.
      type: object
      required:
      - detail
      title: ErrorResponse
      description: Failure shape for every endpoint except `/v1/chat/completions`.
    FieldError:
      properties:
        field:
          type: string
          title: Field
          description: Path to the field, e.g. `body -> input -> 0`.
        message:
          type: string
          title: Message
          description: Why the value was rejected.
        type:
          type: string
          title: Type
          description: Validator that rejected it, e.g. `string_type`.
        input:
          anyOf:
          - {}
          - type: 'null'
          title: Input
          description: The rejected value. Long strings are truncated and containers dropped.
      type: object
      required:
      - field
      - message
      - type
      title: FieldError
      description: One rejected field, as carried in a 422.
    BatchStatus:
      properties:
        batch_id:
          type: string
          title: Batch Id
          description: Unique identifier for the batch job.
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
          - expired
          - cancelled
          title: Status
          description: Current status of the batch job.
        model:
          type: string
          title: Model
          description: The model used for embedding.
        created_at:
          type: string
          title: Created At
          description: ISO 8601 timestamp when job was created.
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Completed At
          description: ISO 8601 timestamp when job completed (if finished).
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
          description: ISO 8601 timestamp when output URL expires (created_at + 24h).
        output_url:
          anyOf:
          - type: string
          - type: 'null'
