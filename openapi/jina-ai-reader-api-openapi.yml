openapi: 3.2.0
info:
  title: Jina AI Reader API
  description: 'Jina AI APIs on three hosts: Reader (`r.jina.ai`), Search (`s.jina.ai`) and the Search Foundation models (`api.jina.ai`). | I want to | Endpoint |

    |---|---|

    | Read a web page or PDF as LLM-friendly Markdown | GET r.jina.ai/{url} · POST r.jina.ai |

    | Search the web and get the result pages as text | GET s.jina.ai/{q} · POST s.jina.ai/search |

    | Embed text, images, audio, video or PDFs | POST /v1/embeddings |

    | Rerank candidates against a query | POST /v1/rerank |

    | Transcribe a document image (OCR) | POST /v1/chat/completions |

    | Embed a large dataset asynchronously | POST /v1/batch/embeddings |

    | See which models exist and what they cost | GET /v1/models |


    **Authentication.** Send `Authorization: Bearer `. Get a key at https://jina.ai/?sui=apikey. Reader also answers without a key, at a lower rate limit; Search needs one. **EU.** `eu.r.jina.ai` and `eu.s.jina.ai` keep all processing inside the EU. **For LLMs.** `curl docs.jina.ai` returns the meta-prompt, a plain-text guide to these APIs written for coding agents. This reference as Markdown: `curl docs.jina.ai/api.md`. **Rate limits.** r.jina.ai 500 RPM (5k premium), s.jina.ai 100 RPM (1k premium). _Merged from https://api.jina.ai/openapi.json, https://r.jina.ai/openapi.json, https://s.jina.ai/openapi.json. Plain text: https://docs.jina.ai/api.md. Spec: https://docs.jina.ai/openapi.json._


    Best-in-class embeddings, rerankers and document models for multilingual and multimodal search. ## Capabilities


    - **Text embeddings** — dense vectors for semantic search, similarity, clustering and classification, in 100+ languages. - **Multimodal embeddings** — images, video, audio and PDFs embedded into the same space as text, so a query in one modality retrieves another. - **Reranking** — score a query against a candidate set and reorder it; more accurate than embedding similarity, and the usual second stage after it. - **Document OCR** — read a page image and return its content as text or markdown, with tables and layout preserved, over the OpenAI chat completions schema. - **Batch embeddings** — the same embedding models over JSONL, asynchronously, for workloads too large to send inline. ## Authentication


    Every endpoint except `GET /v1/models` requires a key:


    ```

    Authorization: Bearer jina_YOUR_API_KEY

    ```


    Get one at jina.ai/api-dashboard/key-manager. ## Rate limits


    Requests per minute and tokens per minute. Anything over a limit answers `429`. | Endpoint | Free | Paid | Premium |

    |---|---|---|---|

    | `/v1/embeddings` | 500 RPM · 1M TPM | 500 RPM · 10M TPM | 5,000 RPM · 100M TPM |

    | `/v1/rerank` | 500 RPM · 1M TPM | 500 RPM · 10M TPM | 5,000 RPM · 100M TPM |

    | `/v1/chat/completions` | 100 RPM · 500K TPM | 100 RPM · 5M TPM | 1,000 RPM · 50M TPM |


    ## Errors


    Failures carry a `detail`, a `code` from the table below and the `request_id` to quote in a support request. `/v1/chat/completions` is the exception: it answers in OpenAI''s error envelope, with the same code inside it.'
  version: 2026.10.13.1624
servers:
- url: https://api.jina.ai
tags:
- name: Reader
  description: Read a URL and get its content back in an LLM-friendly format.
paths:
  /:
    servers:
    - url: https://r.jina.ai
    get:
      tags:
      - Reader
      parameters:
      - name: url
        in: query
        schema:
          type: string
        description: The URL to read. Not needed when the URL is already in the path (`https://r.jina.ai/<url>`).
      - name: preloadUrl
        in: query
        schema:
          type: string
        description: 'URL to preload before scraping.


          Ignored when no URL is provided.'
      - name: noServiceWorker
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBooleanLoose_0x0c'
        description: 'Disable service workers when running the browser.


          Useful for bypassing service-worker-based caching or interception.'
      - name: html
        in: query
        schema:
          type: string
        description: Raw HTML to convert, instead of fetching a URL. Used when no `url` is given.
      - name: base
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_enum_0x0d'
          default: initial
        description: 'Select base modes of relative URLs.


          Supported: initial, final'
      - name: pdf
        in: query
        schema:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Reader_FancyFile_0x0e'
          - type: string
          summary: Base64 encoded PDF.
          description: Base64 encoded PDF.
      - name: file
        in: query
        schema:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Reader_FancyFile_0x0e'
          - type: string
          summary: Base64 encoded file.
          description: Base64 encoded file.
        description: Base64-encoded file (PDF, DOC, XLS, PPT, ...) to convert instead of a URL.
      - name: page
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PageSelection_0x0f'
          summary: Steer which page(s) to return for document files. See PageSelection.
          description: Steer which page(s) to return for document files. See PageSelection.
      - name: respondWith
        in: query
        schema:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Reader_enum_0x10'
          - type: string
          default: content
        description: "Specifies the (non-default) form of the crawled data you prefer.\n\nSupported formats: \n- markdown\n- html\n- text\n- pageshot\n- screenshot\n- content\n- frontmatter\n- any combination of the above\n- vlm\n- jina-ocr-v1\n- jina-ocr\n- readerlm-v2\n\nDefault: content"
      - name: withGeneratedAlt
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBoolean_0x11'
        description: 'Enable automatic alt-text generating for images without an meaningful alt-text.


          Note: Does not work when `X-Respond-With` is specified'
      - name: retainImages
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_enum_0x12'
          default: all
        description: "Image retention modes.\n\nSupported modes: \n- all: all images\n- none: no images\n- alt: only alt text\n- all_p: all images and with generated alt text\n- alt_p: only alt text and with generated alt"
      - name: retainMedia
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_enum_0x13'
          default: link
        description: "Media retention modes for video, audio, and embedded video iframes.\n\nSupported modes: \n- none: no media\n- text: plain label, e.g. `Video 1`\n- link: markdown link, e.g. `[Video 1](url)` (default)\n- image: markdown image syntax, e.g. `![Video 1](url)`\n- html: original HTML with irrelevant attributes (class, id, style, data-*, aria-*) stripped"
      - name: preset
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_enum_0x14'
        description: 'Apply a preset configuration for common scenarios.


          Supported presets:

          - reader: optimized for display to human users

          - index: optimized for semantic indexing

          - research: optimized for academic/research AI agents

          - agent: optimized for day-to-day AI agents

          - spider: optimized for recursive site crawling


          Preset values are applied only to options not explicitly set by the caller.'
      - name: retainLinks
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_enum_0x15'
          default: all
        description: "Link retention modes.\n\nSupported modes: \n- all: all links\n- none: no links\n- text: only link text\n- gpt-oss: gpt-oss link citation format `【{id}†.*】`"
      - name: withLinksSummary
        in: query
        schema:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Reader_PseudoBoolean_0x11'
          - type: string
        description: Enable dedicated summary section for hyper links on the page.
      - name: withImagesSummary
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBooleanLoose_0x0c'
        description: Enable dedicated summary section for images on the page.
      - name: noCache
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBooleanLoose_0x0c'
        description: 'Ignores internal cache if this header is specified with a value.


          Equivalent to X-Cache-Tolerance: 0'
      - name: removeOverlay
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBooleanLoose_0x0c'
        description: Specify whether to remove overlay elements from the page.
      - name: detachInvisibles
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBooleanLoose_0x0c'
        description: 'Temporarily detach elements with computed `display:none` before snapshotting, then restore them.


          Requires the browser engine and disables caching.'
      - name: noGfm
        in: query
        schema:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Reader_PseudoBoolean_0x11'
          - type: string
        description: Opt out of GitHub Flavored Markdown. `true` disables GFM; `table` drops only GFM tables and keeps the table HTML.
      - name: cacheTolerance
        in: query
        schema:
          type: number
        description: Sets internal cache tolerance in seconds if this header is specified with a integer.
      - name: targetSelector
        in: query
        schema:
          type: string
        description: 'Specifies a CSS selector for return target instead of the full html.


          Implies `X-Wait-For-Selector: (same selector)`'
      - name: waitForSelector
        in: query
        schema:
          type: string
        description: 'Specifies a CSS selector to wait for the appearance of such an element before returning.


          Example: `X-Wait-For-Selector: .content-block`'
      - name: removeSelector
        in: query
        schema:
          type: string
        description: 'Specifies a CSS selector to remove elements from the full html.


          Example `X-Remove-Selector: nav`'
      - name: keepImgDataUrl
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBooleanLoose_0x0c'
        description: 'Keep data-url as it instead of transforming them to object-url. (Only applicable when targeting markdown format)


          Example `X-Keep-Img-Data-Url: true`'
      - name: withIframe
        in: query
        schema:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Reader_PseudoBoolean_0x11'
          - type: string
        description: Enable filling iframe contents into main. (violates standards)
      - name: withShadowDom
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBooleanLoose_0x0c'
        description: Enable filling shadow dom contents into main. (violates standards)
      - name: skipCertVerification
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBooleanLoose_0x0c'
        description: Enable skipping SSL certificate verification. (violates security best practices)
      - name: setCookies
        in: query
        schema:
          oneOf:
          - description: Can be any value - string, number, boolean, array or object.
            nullable: true
          - type: string
        description: Cookies to send when fetching the URL, for pages that need a login. Requests with cookies are not cached.
      - name: exportStorageState
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBooleanLoose_0x0c'
        description: 'Export the browser storage state (cookies and per-origin localStorage) accumulated during the crawl.


          When enabled, the JSON response includes a `storageState` field whose shape mirrors the `storageState` request option, so it can be fed back into a subsequent request.


          Requires the browser engine and disables caching.'
      - name: proxyUrl
        in: query
        schema:
          type: string
        description: "Specifies your custom proxy if you prefer to use one.\n\nSupported protocols: \n- http\n- https\n- socks4\n- socks5\n\nFor authentication, https://user:pass@host:port"
      - name: proxyResources
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBooleanLoose_0x0c'
        description: Whether to load resources like image/style/scripts via the proxy server.
      - name: proxy
        in: query
        schema:
          type: string
        description: 'Use a proxy server provided by us.


          Optionally specify two-letter country code.'
      - name: userAgent
        in: query
        schema:
          type: string
        description: "Override User-Agent.\n\nSeveral special values: \n- browser: use the internal browser UA\n- auto: pass-through your UA if it starts with `Mozilla/5.0`, otherwise use the internal browser UA\n- inherit / pass-through: use the User-Agent from the request context if applicable\n- bot: Use a pre-defined bot User-Agent from this service\n- diversify: Use a diversified browser User-Agent\n\nOr specify your own user agent string.\n\nNote: anonymous users specifying a browser UA will have no effect and will fall back to the internal browser UA.\n\nDefault: browser"
      - name: engine
        in: query
        schema:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Reader_enum_0x1b'
          - type: string
        description: 'Specify the engine to use for crawling.


          Supported: browser, direct, cf-browser-rendering'
      - name: injectPageScript
        in: query
        schema:
          type: string
        description: JavaScript to run in the page before extraction, inline or as a URL, e.g. to change the DOM.
      - name: injectFrameScript
        in: query
        schema:
          type: string
        description: Like `injectPageScript`, for frames.
      - name: timeout
        in: query
        schema:
          type: number
          description: '- Some validators will be applied on value(s): (v) =&gt; v &gt; 0 &amp;&amp; v &lt;= 180'
      - name: locale
        in: query
        schema:
          type: string
        description: Specify browser locale for the page.
      - name: referer
        in: query
        schema:
          type: string
        description: Specify referer for the page.
      - name: tokenBudget
        in: query
        schema:
          type: number
        description: 'Specify a budget in tokens.


          If the resulting token cost exceeds the budget, the request is rejected.


          Note this parameter is ignored for the search endpoint.'
      - name: assertStatusCode
        in: query
        schema:
          type: number
        description: Assert the HTTP status code of the crawled page. If the actual status code does not match the asserted one, the request is rejected with 422 Unprocessable Entity.
      - name: instruction
        in: query
        schema:
          type: string
      - name: jsonSchema
        in: query
        schema:
          description: Can be any value - string, number, boolean, array or object.
          nullable: true
      - name: robotsTxt
        in: query
        schema:
          type: string
        description: 'Load and conform to the respective robot.txt on the target origin.


          Optionally specify a bot UA to check against.'
      - name: zeroDataRetention
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBooleanLoose_0x0c'
      - name: respondTiming
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/Reader_enum_0x25'
        description: 'Explicitly specify the respond timing. One of the following:


          - html: directly return unrendered HTML

          - visible-content: return immediately when any content becomes available

          - mutation-idle: wait for DOM mutations to settle and remain unchanged for at least 0.2s

          - resource-idle: wait for no additional resources that would affect page logic and content has SUCCEEDED loading in 0.5s

          - media-idle: wait for no additional resources, including media resources, has SUCCEEDED loading in 0.5s

          - network-idle: wait for full load of webpage, also known as networkidle0.'
      - name: markdownChunking
        in: query
        schema:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Reader_enum_0x26'
          - type: string
        description: "Opt-in markdown chunking.\n\nSupported values: \n- true\n- h1\n- h2\n- h3\n- h4\n- h5\n- structured\n- s1\n- s2\n- s3\n- s4\n- s5\n\nNote if you are expecting text return, the chunking is done by injecting character \\u001D"
      - name: maxTokens
        in: query
        schema:
          type: number
          description: '- Some validators will be applied on value(s): (v) =&gt; v &gt;= 500'
      - name: Accept
        description: "Specifies your preference for the response format.\n\nSupported formats: \n- text/event-stream\n- application/json or text/json\n- text/plain"
        in: header
        schema:
          type: string
      - name: X-Cache-Tolerance
        description: Sets internal cache tolerance in seconds if this header is specified with a integer.
        in: header
        schema:
          type: string
      - name: X-No-Cache
        description: 'Ignores internal cache if this header is specified with a value.


          Equivalent to X-Cache-Tolerance: 0'
        in: header
        schema:
          type: string
      - name: X-Respond-With
        description: "Specifies the (non-default) form of the crawled data you prefer.\n\nSupported formats: \n- markdown\n- html\n- text\n- pageshot\n- screenshot\n- content\n- frontmatter\n- any combination of the above\n- vlm\n- jina-ocr-v1\n- jina-ocr\n- readerlm-v2\n\nDefault: content"
        in: header
        schema:
          type: string
      - name: X-Wait-For-Selector
        description: 'Specifies a CSS selector to wait for the appearance of such an element before returning.


          Example: `X-Wait-For-Selector: .content-block`'
        in: header
        schema:
          type: string
      - name: X-Target-Selector
        description: 'Specifies a CSS selector for return target instead of the full html.


          Implies `X-Wait-For-Selector: (same selector)`'
        in: header
        schema:
          type: string
      - name: X-Remove-Selector
        description: 'Specifies a CSS selector to remove elements from the full html.


          Example `X-Remove-Selector: nav`'
        in: header
        schema:
          type: string
      - name: X-Keep-Img-Data-Url
        description: 'Keep data-url as it instead of transforming them to object-url. (Only applicable when targeting markdown format)


          Example `X-Keep-Img-Data-Url: true`'
        in: header
        schema:
          type: string
      - name: X-Proxy-Url
        description: "Specifies your custom proxy if you prefer to use one.\n\nSupported protocols: \n- http\n- https\n- socks4\n- socks5\n\nFor authentication, https://user:pass@host:port"
        in: header
        schema:
          type: string
      - name: X-Proxy-Resources
        description: Whether to load resources like image/style/scripts via the proxy server.
        in: header
        schema:
          type: string
      - name: X-Proxy
        description: 'Use a proxy server provided by us.


          Optionally specify two-letter country code.'
        in: header
        schema:
          type: string
      - name: X-Robots-Txt
        description: 'Load and conform to the respective robot.txt on the target origin.


          Optionally specify a bot UA to check against.'
        in: header
        schema:
          type: string
      - name: DNT
        description: When set to 1, prevent the result of this request to be cached in the system.
        in: header
        schema:
          type: string
      - name: X-Set-Cookie
        description: "Sets cookie(s) to the headless browser for your request. \n\nSyntax is the same with standard Set-Cookie"
        in: header
        schema:
          type: string
      - name: X-Export-Storage-State
        description: 'Export the browser storage state (cookies and per-origin localStorage) accumulated during the crawl.


          When enabled, the JSON response includes a `storageState` field whose shape mirrors the `storageState` request option, so it can be fed back into a subsequent request.


          Requires the browser engine and disables caching.'
        in: header
        schema:
          type: string
      - name: X-With-Generated-Alt
        description: 'Enable automatic alt-text generating for images without an meaningful alt-text.


          Note: Does not work when `X-Respond-With` is specified'
        in: header
        schema:
          type: string
      - name: X-With-Images-Summary
        description: Enable dedicated summary section for images on the page.
        in: header
        schema:
          type: string
      - name: X-With-links-Summary
        description: Enable dedicated summary section for hyper links on the page.
        in: header
        schema:
          type: string
      - name: X-Retain-Links
        description: "Link retention modes.\n\nSupported modes: \n- all: all links\n- none: no links\n- text: only link text\n- gpt-oss: gpt-oss link citation format `【{id}†.*】`"
        in: header
        schema:
          type: string
      - name: X-Retain-Images
        description: "Image retention modes.\n\nSupported modes: \n- all: all images\n- none: no images\n- alt: only alt text\n- all_p: all images and with generated alt text\n- alt_p: only alt text and with generated alt"
        in: header
        schema:
          type: string
      - name: X-Retain-Media
        description: "Media retention modes for video, audio, and embedded video iframes.\n\nSupported modes: \n- none: no media\n- text: plain label, e.g. `Video 1`\n- link: markdown link, e.g. `[Video 1](url)` (default)\n- image: markdown image syntax, e.g. `![Video 1](url)`\n- html: original HTML with irrelevant attributes (class, id, style, data-*, aria-*) stripped"
        in: header
        schema:
          type: string
      - name: X-Preset
        description: 'Apply a preset configuration for common scenarios.


          Supported presets:

          - reader: optimized for display to human users

          - index: optimized for semantic indexing

          - research: optimized for academic/research AI agents

          - agent: optimized for day-to-day AI agents

          - spider: optimized for recursive site crawling


          Preset values are applied only to options not explicitly set by the caller.'
        in: header
        schema:
          type: string
      - name: X-With-Iframe
        description: Enable filling iframe contents into main. (violates standards)
        in: header
        schema:
          type: string
      - name: X-With-Shadow-Dom
        description: Enable filling shadow dom contents into main. (violates standards)
        in: header
        schema:
          type: string
      - name: X-Skip-Cert-Verification
        description: Enable skipping SSL certificate verification. (violates security best practices)
        in: header
        schema:
          type: string
      - name: X-User-Agent
        description: "Override User-Agent.\n\nSeveral special values: \n- browser: use the internal browser UA\n- auto: pass-through your UA if it starts with `Mozilla/5.0`, otherwise use the internal browser UA\n- inherit / pass-through: use the User-Agent from the request context if applicable\n- bot: Use a pre-defined bot User-Agent from this service\n- diversify: Use a diversified browser User-Agent\n\nOr specify your own user agent string.\n\nNote: anonymous users specifying a browser UA will have no effect and will fall back to the internal browser UA.\n\nDefault: browser"
        in: header
        schema:
          type: string
      - name: X-Timeout
        description: Specify timeout in seconds. Max 180.
        in: header
        schema:
          type: string
      - name: X-Locale
        description: Specify browser locale for the page.
        in: header
        schema:
          type: string
      - name: X-Referer
        description: Specify referer for the page.
        in: header
        schema:
          type: string
      - name: X-Token-Budget
        description: 'Specify a budget in tokens.


          If the resulting token cost exceeds the budget, the request is rejected.


          Note this parameter is ignored for the search endpoint.'
        in: header
        schema:
          type: string
      - name: X-Max-Tokens
        description: Trim the response content at a maximum number of tokens.
        in: header
        schema:
          type: string
      - name: X-Assert-Status-Code
        description: Assert the HTTP status code of the crawled page. If the actual status code does not match the asserted one, the request is rejected with 422 Unprocessable Entity.
        in: header
        schema:
          type: string
      - name: X-Respond-Timing
        description: 'Explicitly specify the respond timing. One of the following:


          - html: directly return unrendered HTML

          - visible-content: return immediately when any content becomes available

          - mutation-idle: wait for DOM mutations to settle and remain unchanged for at least 0.2s

          - resource-idle: wait for no additional resources that would affect page logic and content has SUCCEEDED loading in 0.5s

          - media-idle: wait for no additional resources, including media resources, has SUCCEEDED loading in 0.5s

          - network-idle: wait for full load of webpage, also known as networkidle0.'
        in: header
        schema:
          type: string
      - name: X-Engine
        description: 'Specify the engine to use for crawling.


          Supported: browser, direct, cf-browser-rendering'
        in: header
        schema:
          type: string
      - name: X-Base
        description: 'Select base modes of relative URLs.


          Supported: initial, final'
        in: header
        schema:
          type: string
      - name: X-Remove-Overlay
        description: Specify whether to remove overlay elements from the page.
        in: header
        schema:
          type: string
      - name: X-Detach-Invisibles
        description: 'Temporarily detach elements with computed `display:none` before snapshotting, then restore them.


          Requires the browser engine and disables caching.'
        in: header
        schema:
          type: string
      - name: X-Markdown-Chunking
        description: "Opt-in markdown chunking.\n\nSupported values: \n- true\n- h1\n- h2\n- h3\n- h4\n- h5\n- structured\n- s1\n- s2\n- s3\n- s4\n- s5\n\nNote if you are expecting text return, the chunking is done by injecting character \\u001D"
        in: header
        schema:
          type: string
      - name: X-Md-Heading-Style
        description: 'Heading style of the generated markdown.


          This is an option passed through to [Turndown](https://github.com/mixmark-io/turndown?tab=readme-ov-file#options).


          Supported: setext, atx'
        in: header
        schema:
          type: string
      - name: X-Md-Hr
        description: 'Hr text of the generated markdown.


          This is an option passed through to [Turndown](https://github.com/mixmark-io/turndown?tab=readme-ov-file#options).'
        in: header
        schema:
          type: string
      - name: X-Md-Bullet-List-Marker
        description: 'Bullet list marker of the generated markdown.


          This is an option passed through to [Turndown](https://github.com/mixmark-io/turndown?tab=readme-ov-file#options).


          Supported: -, +, *'
        in: header
        schema:
          type: string
      - name: X-Md-Em-Delimiter
        description: 'Em delimiter of the generated markdown.


          This is an option passed through to [Turndown](https://github.com/mixmark-io/turndown?tab=readme-ov-file#options).


          Supported: _, *'
        in: header
        schema:
          type: string
      - name: X-Md-Strong-Delimiter
        description: 'Strong delimiter of the generated markdown.


          This is an option passed through to [Turndown](https://github.com/mixmark-io/turndown?tab=readme-ov-file#options).


          Supported: **, __'
        in: header
        schema:
          type: string
      - name: X-Md-Link-Style
        description: 'Link style of the generated markdown.


          This is an option passed through to [Turndown](https://github.com/mixmark-io/turndown?tab=readme-ov-file#options).


          Supported: inlined, referenced, discarded'
        in: header
        schema:
          type: string
      - name: X-Md-Link-Reference-Style
        description: 'Link reference style of the generated markdown.


          This is an option passed through to [Turndown](https://github.com/mixmark-io/turndown?tab=readme-ov-file#options).


          Supported: full, collapsed, shortcut, discarded'
        in: header
        schema:
          type: string
      - name: X-Page
        description: 'Steer which page to return for uploaded files (PDF, DOC, XLS, PPT, etc.).


          1-indexed, 0 is the same as 1. Accepts a page number, a list and/or ranges like `1,3,5-7`.


          At most 35 pages can be selected. With multiple pages, DocLayout / OCR runs over each selected page.


          Ignored when the target is not a document.'
        in: header
        schema:
          type: string
      - name: X-Preload-Url
        description: 'URL to preload before scraping.


          Ignored when no URL is provided.'
        in: header
        schema:
          type: string
      - name: X-No-Service-Worker
        description: 'Disable service workers when running the browser.


          Useful for bypassing service-worker-based caching or interception.'
        in: header
        schema:
          type: string
