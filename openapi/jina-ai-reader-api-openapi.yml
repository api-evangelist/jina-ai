            type: string
          description: Like `injectPageScript`, for frames.
        timeout:
          type: number
          description: '- Some validators will be applied on value(s): (v) =&gt; v &gt; 0 &amp;&amp; v &lt;= 180'
        locale:
          type: string
          description: Specify browser locale for the page.
        referer:
          type: string
          description: Specify referer for the page.
        tokenBudget:
          type: number
          description: 'Specify a budget in tokens.


            If the resulting token cost exceeds the budget, the request is rejected.


            Note this parameter is ignored for the search endpoint.'
        assertStatusCode:
          type: number
          description: Assert the HTTP status code of the crawled page. If the actual status code does not match the asserted one, the request is rejected with 422 Unprocessable Entity.
        viewport:
          allOf:
          - $ref: '#/components/schemas/Reader_Viewport_0x1c'
        instruction:
          type: string
        jsonSchema:
          description: Can be any value - string, number, boolean, array or object.
          nullable: true
        robotsTxt:
          type: string
          description: 'Load and conform to the respective robot.txt on the target origin.


            Optionally specify a bot UA to check against.'
        zeroDataRetention:
          allOf:
          - $ref: '#/components/schemas/Reader_PseudoBooleanLoose_0x0c'
        markdown:
          allOf:
          - $ref: '#/components/schemas/Reader_TurnDownTweakableOptions_0x23'
