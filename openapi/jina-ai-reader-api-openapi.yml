                      summary: 'Envelope code.


                        Mirror of HTTP status code'
                      description: '[REQUIRED]


                        Envelope code.


                        Mirror of HTTP status code'
                      default: 200
                    status:
                      type: number
                      summary: 'Envelope status.


                        In extension to HTTP status code'
                      description: '[REQUIRED]


                        Envelope status.


                        In extension to HTTP status code'
                      default: 20000
                    data:
                      description: The result payload you expect
                      nullable: true
                      summary: The result payload you expect
                    meta:
                      description: The metadata that the payload sometimes came with
                      nullable: true
                      summary: The metadata that the payload sometimes came with
                  required:
                  - code
                  - status
                  primitive: true
          headers: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Reader_ParamValidationError_0x28'
                - allOf:
                  - $ref: '#/components/schemas/Reader_DataStreamBrokenError_0x29'
          headers: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Reader_AuthenticationFailedError_0x2a'
                - allOf:
                  - $ref: '#/components/schemas/Reader_AuthenticationRequiredError_0x2b'
          headers: {}
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Reader_TierFeatureConstraintError_0x2c'
                - allOf:
                  - $ref: '#/components/schemas/Reader_InsufficientBalanceError_0x2d'
          headers: {}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Reader_OperationNotAllowedError_0x2e'
                - allOf:
                  - $ref: '#/components/schemas/Reader_AbuseAlleviationError_0x2f'
          headers: {}
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Reader_ResourcePolicyDenyError_0x30'
                - allOf:
                  - $ref: '#/components/schemas/Reader_BudgetExceededError_0x31'
          headers: {}
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Reader_TargetFileTooLargeError_0x32'
          headers: {}
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Reader_SubmittedDataMalformedError_0x33'
                - allOf:
                  - $ref: '#/components/schemas/Reader_DownstreamServiceFailureError_0x34'
                - allOf:
                  - $ref: '#/components/schemas/Reader_AssertionFailureError_0x35'
          headers: {}
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Reader_RateLimitTriggeredError_0x36'
          headers: {}
        '451':
          description: Unavailable For Legal Reasons
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Reader_HarmfulContentError_0x37'
          headers: {}
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Reader_DownstreamServiceError_0x38'
          headers: {}
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Reader_ServiceNodeResourceDrainError_0x39'
          headers: {}
