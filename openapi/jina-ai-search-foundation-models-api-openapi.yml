openapi: 3.2.0
info:
  title: Jina AI Search Foundation Models API
  description: 'Jina AI APIs on three hosts: Reader (`r.jina.ai`), Search (`s.jina.ai`) and the Search Foundation models (`api.jina.ai`). | I want to | Endpoint |

    |---|---|

    | Read a web page or PDF as LLM-friendly Markdown | GET r.jina.ai/{url} · POST r.jina.ai |

    | Search the web and get the result pages as text | GET s.jina.ai/{q} · POST s.jina.ai/search |

    | Embed text, images, audio, video or PDFs | POST /v1/embeddings |

    | Rerank candidates against a query | POST /v1/rerank |

    | Transcribe a document image (OCR) | POST /v1/chat/completions |

    | Embed a large dataset asynchronously | POST /v1/batch/embeddings |

    | See which models exist and what they cost | GET /v1/models |


    **Authentication.** Send `Authorization: Bearer `. Get a key at https://jina.ai/?sui=apikey. Reader also answers without a key, at a lower rate limit; Search needs one. **EU.** `eu.r.jina.ai` and `eu.s.jina.ai` keep all processing inside the EU. **For LLMs.** `curl docs.jina.ai` returns the meta-prompt, a plain-text guide to these APIs written for coding agents. This reference as Markdown: `curl docs.jina.ai/api.md`. **Rate limits.** r.jina.ai 500 RPM (5k premium), s.jina.ai 100 RPM (1k premium). _Merged from https://api.jina.ai/openapi.json, https://r.jina.ai/openapi.json, https://s.jina.ai/openapi.json. Plain text: https://docs.jina.ai/api.md. Spec: https://docs.jina.ai/openapi.json._


    Best-in-class embeddings, rerankers and document models for multilingual and multimodal search. ## Capabilities


    - **Text embeddings** — dense vectors for semantic search, similarity, clustering and classification, in 100+ languages. - **Multimodal embeddings** — images, video, audio and PDFs embedded into the same space as text, so a query in one modality retrieves another. - **Reranking** — score a query against a candidate set and reorder it; more accurate than embedding similarity, and the usual second stage after it. - **Document OCR** — read a page image and return its content as text or markdown, with tables and layout preserved, over the OpenAI chat completions schema. - **Batch embeddings** — the same embedding models over JSONL, asynchronously, for workloads too large to send inline. ## Authentication


    Every endpoint except `GET /v1/models` requires a key:


    ```

    Authorization: Bearer jina_YOUR_API_KEY

    ```


    Get one at jina.ai/api-dashboard/key-manager. ## Rate limits


    Requests per minute and tokens per minute. Anything over a limit answers `429`. | Endpoint | Free | Paid | Premium |

    |---|---|---|---|

    | `/v1/embeddings` | 500 RPM · 1M TPM | 500 RPM · 10M TPM | 5,000 RPM · 100M TPM |

    | `/v1/rerank` | 500 RPM · 1M TPM | 500 RPM · 10M TPM | 5,000 RPM · 100M TPM |

    | `/v1/chat/completions` | 100 RPM · 500K TPM | 100 RPM · 5M TPM | 1,000 RPM · 50M TPM |


    ## Errors


    Failures carry a `detail`, a `code` from the table below and the `request_id` to quote in a support request. `/v1/chat/completions` is the exception: it answers in OpenAI''s error envelope, with the same code inside it.'
  version: 2026.10.13.1624
servers:
- url: https://api.jina.ai
tags:
- name: Search Foundation Models
  description: '**Embeddings** turn text, images, audio, video and PDFs into dense vectors for semantic search, RAG, clustering and classification. Task-specific variants (`retrieval.query`, `retrieval.passage`, `text-matching`, `clustering`, `classification`) are selected per request rather than per model, and `dimensions` truncates the output where a model supports it.


    **Reranking** scores a query against a candidate set and returns it reordered, which is more accurate than embedding similarity and slower — the usual shape is embeddings to retrieve, reranking to refine.


    Each endpoint''s `model` field lists the models it accepts.'
paths:
  /v1/embeddings:
    post:
      tags:
      - Search Foundation Models
      summary: Embeddings
      description: 'Embed text, images, audio, video or PDFs as dense vectors.


        `model` selects the request shape as well as the model: each one below

        lists the inputs and options it accepts.'
      operationId: embeddings_v1_embeddings_post
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/EmbeddingsV2Request'
              - $ref: '#/components/schemas/EmbeddingsV3Request'
              - $ref: '#/components/schemas/EmbeddingsV4Request'
              - $ref: '#/components/schemas/EmbeddingsV5Request'
              - $ref: '#/components/schemas/CodeEmbeddings500MRequest'
              - $ref: '#/components/schemas/CodeEmbeddings1500MRequest'
              - $ref: '#/components/schemas/ClipV1Request'
              - $ref: '#/components/schemas/ClipV2Request'
              - $ref: '#/components/schemas/ColbertV1Request'
              - $ref: '#/components/schemas/ColbertV2Request'
              title: Embedding Request
              discriminator:
                propertyName: model
                mapping:
                  jina-embeddings-v2-base-en: '#/components/schemas/EmbeddingsV2Request'
                  jina-embeddings-v2-base-zh: '#/components/schemas/EmbeddingsV2Request'
                  jina-embeddings-v2-base-de: '#/components/schemas/EmbeddingsV2Request'
                  jina-embeddings-v2-base-es: '#/components/schemas/EmbeddingsV2Request'
                  jina-embeddings-v2-base-code: '#/components/schemas/EmbeddingsV2Request'
                  jina-embeddings-v3: '#/components/schemas/EmbeddingsV3Request'
                  jina-embeddings-v4: '#/components/schemas/EmbeddingsV4Request'
                  jina-embeddings-v5-text-nano: '#/components/schemas/EmbeddingsV5Request'
                  jina-embeddings-v5-text-small: '#/components/schemas/EmbeddingsV5Request'
                  jina-embeddings-v5-omni-small: '#/components/schemas/EmbeddingsV5Request'
                  jina-embeddings-v5-omni-nano: '#/components/schemas/EmbeddingsV5Request'
                  jina-code-embeddings-0.5b: '#/components/schemas/CodeEmbeddings500MRequest'
                  jina-code-embeddings-1.5b: '#/components/schemas/CodeEmbeddings1500MRequest'
                  jina-clip-v1: '#/components/schemas/ClipV1Request'
                  jina-clip-v2: '#/components/schemas/ClipV2Request'
                  jina-colbert-v1-en: '#/components/schemas/ColbertV1Request'
                  jina-colbert-v2: '#/components/schemas/ColbertV2Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          description: 'Bad Request: `INPUT_INVALID_LABELS`, `INPUT_LABEL_LIMIT_EXCEEDED`, `INPUT_MODEL_NOT_FOUND`, `INPUT_TOKEN_LIMIT_EXCEEDED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Unauthorized: `AUTH_INVALID_API_KEY`, `AUTH_INVALID_FORMAT`, `AUTH_MISSING_API_KEY`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Forbidden: `AUTHZ_INSUFFICIENT_BALANCE`, `AUTHZ_RESOURCE_LIMIT_EXCEEDED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Not Found: `RESOURCE_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Conflict: `CONFLICT_RESOURCE_BUSY`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request body failed schema validation. `errors` names each field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Too Many Requests: `RATE_CONCURRENCY_LIMIT_EXCEEDED`, `RATE_IP_LIMIT_EXCEEDED`, `RATE_REQUEST_LIMIT_EXCEEDED`, `RATE_TOKEN_LIMIT_EXCEEDED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Internal Server Error: `INTERNAL_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Service Unavailable: `SERVICE_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: 'Gateway Timeout: `SERVICE_TIMEOUT`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /v1/rerank:
    post:
      tags:
      - Search Foundation Models
      summary: Rerank
      description: 'Score documents against a query and return them reordered.


        Results come back sorted by `relevance_score`, each carrying the index

        it held in the request so the caller can map them back.'
      operationId: rerank_v1_rerank_post
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/TextRerankerRequest'
              - $ref: '#/components/schemas/RerankerM0Request'
              - $ref: '#/components/schemas/RerankerV3Request'
              title: Reranking Request
              discriminator:
                propertyName: model
                mapping:
                  jina-reranker-v2-base-multilingual: '#/components/schemas/TextRerankerRequest'
                  jina-reranker-v1-tiny-en: '#/components/schemas/TextRerankerRequest'
                  jina-reranker-v1-turbo-en: '#/components/schemas/TextRerankerRequest'
                  jina-reranker-v1-base-en: '#/components/schemas/TextRerankerRequest'
                  jina-colbert-v1-en: '#/components/schemas/TextRerankerRequest'
                  jina-colbert-v2: '#/components/schemas/TextRerankerRequest'
                  jina-reranker-m0: '#/components/schemas/RerankerM0Request'
                  jina-reranker-v3: '#/components/schemas/RerankerV3Request'
                  jina-reranker-v3.5: '#/components/schemas/RerankerV3Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankingResponse'
        '400':
          description: 'Bad Request: `INPUT_INVALID_LABELS`, `INPUT_LABEL_LIMIT_EXCEEDED`, `INPUT_MODEL_NOT_FOUND`, `INPUT_TOKEN_LIMIT_EXCEEDED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Unauthorized: `AUTH_INVALID_API_KEY`, `AUTH_INVALID_FORMAT`, `AUTH_MISSING_API_KEY`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Forbidden: `AUTHZ_INSUFFICIENT_BALANCE`, `AUTHZ_RESOURCE_LIMIT_EXCEEDED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Not Found: `RESOURCE_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Conflict: `CONFLICT_RESOURCE_BUSY`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request body failed schema validation. `errors` names each field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Too Many Requests: `RATE_CONCURRENCY_LIMIT_EXCEEDED`, `RATE_IP_LIMIT_EXCEEDED`, `RATE_REQUEST_LIMIT_EXCEEDED`, `RATE_TOKEN_LIMIT_EXCEEDED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Internal Server Error: `INTERNAL_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Service Unavailable: `SERVICE_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: 'Gateway Timeout: `SERVICE_TIMEOUT`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
components:
  schemas:
    EmbeddingsV4Request:
      properties:
        embedding_type:
          anyOf:
          - type: string
            enum:
            - float
            - base64
            - binary
            - ubinary
          - items:
              type: string
              enum:
              - float
              - base64
              - binary
              - ubinary
            type: array
          - type: 'null'
          title: Embedding Type
          description: 'Output encoding format: `float`, `base64`, `binary`, `ubinary`, or a list of these.'
        model:
          type: string
          const: jina-embeddings-v4
          title: Model
          description: The embedding model to use.
        input:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/TextDoc'
          - $ref: '#/components/schemas/ImageDoc'
          - $ref: '#/components/schemas/PDFDoc'
          - items:
              anyOf:
              - type: string
              - $ref: '#/components/schemas/TextDoc'
              - $ref: '#/components/schemas/ImageDoc'
            type: array
          title: Input
          description: 'Content to embed: a string, `TextDoc`, `ImageDoc`, `PDFDoc`, or a list of items. PDFs must be sent individually. Images up to 8MB; PDFs up to 8MB.'
        truncate:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Truncate
          description: If true, truncates input exceeding the model's max token limit instead of returning an error.
          default: false
        late_chunking:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Late Chunking
          description: If true, concatenates all text inputs and processes as one sequence before splitting. Only works with text.
        dimensions:
          anyOf:
          - type: integer
            maximum: 2048
            exclusiveMinimum: 0
          - type: 'null'
          title: Dimensions
          description: 'Number of dimensions for the output embedding. Range: 1-2048.'
        task:
          anyOf:
          - type: string
            enum:
            - text-matching
            - retrieval.query
            - retrieval.passage
            - code.query
            - code.passage
          - type: 'null'
          title: Task
          description: 'Task optimization: `text-matching` (default), `retrieval.query`, `retrieval.passage`, `code.query`, or `code.passage`.'
          default: text-matching
        return_multivector:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Return Multivector
          description: If true, returns one embedding per token. Cannot be used with `dimensions`.
          default: false
        return_tokenized_input:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Return Tokenized Input
          description: If true, returns tokens alongside multi-vector embeddings. Requires `return_multivector=true`.
          default: false
      type: object
      required:
      - model
      - input
      title: EmbeddingsV4Request
      description: Jina Embeddings v4 multimodal model for text, images, and PDFs.
      examples:
      - dimensions: 512
        embedding_type: float
        input:
        - image: https://i.ibb.co/nQNGqL0/beach1.jpg
        - text: A beautiful sunset over the beach
        model: jina-embeddings-v4
      - embedding_type: float
        input:
        - Jina AI - Your Search Foundation - Supercharged
        late_chunking: true
        model: jina-embeddings-v4
        task: retrieval.passage
      - dimensions: 512
        embedding_type: float
        input:
          pdf: https://example.com/sample.pdf
        model: jina-embeddings-v4
    CodeEmbeddings1500MRequest:
      properties:
        embedding_type:
          anyOf:
          - type: string
            enum:
            - float
            - base64
            - binary
            - ubinary
          - items:
              type: string
              enum:
              - float
              - base64
              - binary
              - ubinary
            type: array
          - type: 'null'
          title: Embedding Type
          description: 'Output encoding format: `float`, `base64`, `binary`, `ubinary`, or a list of these.'
        model:
          type: string
          const: jina-code-embeddings-1.5b
          title: Model
          description: The code embedding model to use.
        input:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/TextDoc'
          - items:
              anyOf:
              - type: string
              - $ref: '#/components/schemas/TextDoc'
            type: array
          title: Input
          description: 'Code or text to embed: a string, `TextDoc`, or a list of items.'
        truncate:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Truncate
          description: If true, truncates input exceeding the model's max token limit instead of returning an error.
          default: false
        dimensions:
          anyOf:
          - type: integer
            maximum: 1536
            exclusiveMinimum: 0
          - type: 'null'
          title: Dimensions
          description: 'Number of dimensions for the output embedding. Range: 1-1536.'
        task:
          anyOf:
          - type: string
            enum:
            - nl2code.query
            - nl2code.passage
            - qa.query
            - qa.passage
            - code2code.query
            - code2code.passage
            - code2nl.query
            - code2nl.passage
            - code2completion.query
            - code2completion.passage
          - type: 'null'
          title: Task
          description: 'Task type: `nl2code`, `qa`, `code2code`, `code2nl`, or `code2completion`. Use `.query` for queries, `.passage` for documents.'
          default: nl2code.query
      type: object
      required:
      - model
      - input
      title: CodeEmbeddings1500MRequest
      description: Code embeddings (1.5b) for search over source, and between source and prose.
      examples:
      - dimensions: 512
        input:
        - "import * as ElementPlusIconsVue from '@element-plus/icons-vue'\nconst app = createApp(App)\nfor (const [key, component] of Object.entries(ElementPlusIconsVue)) {\n  app.component(key, component)\n}"
        model: jina-code-embeddings-1.5b
        task: nl2code.passage
    BaseUsage:
      properties:
        total_tokens:
          type: integer
          title: Total Tokens
          description: Total number of tokens processed.
      type: object
      required:
      - total_tokens
      title: BaseUsage
    RerankingResponse:
      properties:
        model:
          type: string
          title: Model
          description: The model used for reranking.
        object:
          type: string
          title: Object
          description: Object type, always `list`.
          default: list
        usage:
          $ref: '#/components/schemas/BaseUsage'
          description: Token usage statistics.
        results:
          items:
            $ref: '#/components/schemas/RerankingResult'
          type: array
          title: Results
          description: Ranked documents, sorted by relevance score descending.
      type: object
      required:
      - model
      - usage
      - results
      title: RerankingResponse
      description: Response containing ranked documents.
    CodeEmbeddings500MRequest:
      properties:
        embedding_type:
          anyOf:
          - type: string
            enum:
            - float
            - base64
            - binary
            - ubinary
          - items:
              type: string
              enum:
              - float
              - base64
              - binary
              - ubinary
            type: array
          - type: 'null'
          title: Embedding Type
          description: 'Output encoding format: `float`, `base64`, `binary`, `ubinary`, or a list of these.'
        model:
          type: string
          const: jina-code-embeddings-0.5b
          title: Model
          description: The code embedding model to use.
        input:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/TextDoc'
          - items:
              anyOf:
              - type: string
              - $ref: '#/components/schemas/TextDoc'
            type: array
          title: Input
          description: 'Code or text to embed: a string, `TextDoc`, or a list of items.'
        truncate:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Truncate
          description: If true, truncates input exceeding the model's max token limit instead of returning an error.
          default: false
        dimensions:
          anyOf:
          - type: integer
            maximum: 896
            exclusiveMinimum: 0
          - type: 'null'
          title: Dimensions
          description: 'Number of dimensions for the output embedding. Range: 1-896.'
        task:
          anyOf:
          - type: string
            enum:
            - nl2code.query
            - nl2code.passage
            - qa.query
            - qa.passage
            - code2code.query
            - code2code.passage
            - code2nl.query
            - code2nl.passage
            - code2completion.query
            - code2completion.passage
          - type: 'null'
          title: Task
          description: 'Task type: `nl2code`, `qa`, `code2code`, `code2nl`, or `code2completion`. Use `.query` for queries, `.passage` for documents.'
          default: nl2code.query
      type: object
      required:
      - model
      - input
      title: CodeEmbeddings500MRequest
      description: Code embeddings (0.5b) for search over source, and between source and prose.
      examples:
      - dimensions: 512
        embedding_type: float
        input:
        - "import * as ElementPlusIconsVue from '@element-plus/icons-vue'\nconst app = createApp(App)\nfor (const [key, component] of Object.entries(ElementPlusIconsVue)) {\n  app.component(key, component)\n}"
        model: jina-code-embeddings-0.5b
        task: nl2code.passage
    RerankerM0Request:
      properties:
        query:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/ImageDoc'
          title: Query
          description: 'The query to rank documents against: a text string, or an image object (`{"image": <url|base64>}`) for a visual query.'
        top_n:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Top N
          description: Number of top results to return. If not set, returns all documents.
        return_documents:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Return Documents
          description: If true (default), includes document content in each result.
          default: true
        model:
          type: string
          const: jina-reranker-m0
          title: Model
          description: The multimodal reranking model to use.
        documents:
          items:
            anyOf:
            - type: string
            - $ref: '#/components/schemas/TextDoc'
            - $ref: '#/components/schemas/ImageDoc'
          type: array
          minItems: 1
          title: Documents
          description: 'Documents to rank: strings, `TextDoc`, or `ImageDoc` objects.'
      type: object
      required:
      - query
      - model
      - documents
      title: RerankerM0Request
      description: 'Multimodal reranker: the query and the documents may each be text or an image.'
      example:
        documents:
        - image: https://raw.githubusercontent.com/jina-ai/multimodal-reranker-test/main/paper-11.png
        - text: 'Attention Is All You Need: This groundbreaking paper introduced the Transformer architecture, revolutionizing natural language processing and becoming the foundation for modern large language models like GPT and BERT.'
        - Recent advances in computer vision have led to the development of vision transformers (ViTs) that achieve state-of-the-art performance on image classification tasks by treating images as sequences of patches.
        - image: https://raw.githubusercontent.com/jina-ai/multimodal-reranker-test/main/wired-preview.png
        - text: 'Graph Neural Networks: A Review of Methods and Applications. This comprehensive survey covers the latest developments in graph-based machine learning, including graph convolutional networks and graph attention mechanisms.'
        - Traditional database systems struggle with the volume and variety of modern data workloads, leading to the adoption of distributed computing frameworks like Apache Spark and Hadoop for big data processing.
        model: jina-reranker-m0
        query: innovative artificial intelligence research papers and visual data analysis
        return_documents: false
        top_n: 4
    AudioDoc:
      properties:
        audio:
          type: string
          title: Audio
          description: Audio as a URL or base64-encoded string.
      type: object
      required:
      - audio
      title: AudioDoc
    MultiEmbeddingData:
      properties:
        object:
          type: string
          title: Object
          description: Object type, always `embeddings` for multi-vector output.
          default: embeddings
        index:
          type: integer
          title: Index
          description: Position of this result in the input list.
        embeddings:
          anyOf:
          - items:
              type: string
            type: array
          - items:
              items:
                type: number
              type: array
            type: array
          title: Embeddings
          description: Per-token embedding vectors. Each is a list of floats or base64 string.
        tokenized_input:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tokenized Input
          description: Tokens corresponding to each embedding, if `return_tokenized_input=true`.
      type: object
      required:
      - index
      - embeddings
      title: MultiEmbeddingData
      description: Multi-vector embedding result (one vector per token).
    PDFDoc:
      properties:
        pdf:
          type: string
          title: Pdf
          description: PDF as a URL or base64-encoded string.
      type: object
      required:
      - pdf
      title: PDFDoc
    ColbertV1Request:
      properties:
