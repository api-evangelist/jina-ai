          anyOf:
          - type: boolean
          - type: 'null'
          title: Truncate
          description: If true, truncates input exceeding the model's max token limit instead of returning an error.
          default: false
        model:
          type: string
          enum:
          - jina-embeddings-v5-text-nano
          - jina-embeddings-v5-text-small
          - jina-embeddings-v5-omni-small
          - jina-embeddings-v5-omni-nano
          title: Model
          description: The embedding model to use.
        input:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/TextDoc'
          - $ref: '#/components/schemas/ImageDoc'
          - $ref: '#/components/schemas/VideoDoc'
          - $ref: '#/components/schemas/AudioDoc'
          - $ref: '#/components/schemas/PDFDoc'
          - items:
              anyOf:
              - type: string
              - $ref: '#/components/schemas/TextDoc'
              - $ref: '#/components/schemas/ImageDoc'
              - $ref: '#/components/schemas/VideoDoc'
              - $ref: '#/components/schemas/AudioDoc'
              - $ref: '#/components/schemas/MergedContentGroup'
            type: array
          title: Input
          description: 'Content to embed: a string, `TextDoc`, `ImageDoc`, `VideoDoc`, `AudioDoc`, `PDFDoc`, or a list of these. A list item may also be a `{content: [...]}` group, fused into one embedding. A PDF must be sent on its own, not inside a list.'
        task:
          anyOf:
          - type: string
            enum:
            - retrieval.query
            - retrieval.passage
            - text-matching
            - clustering
            - classification
          - type: 'null'
          title: Task
          description: 'Task optimization: `retrieval.query` for queries, `retrieval.passage` for documents, `text-matching` for similarity, `clustering`, or `classification`.'
          default: text-matching
        dimensions:
          anyOf:
          - type: integer
            maximum: 1024
            exclusiveMinimum: 0
          - type: 'null'
          title: Dimensions
          description: 'Number of dimensions for the output embedding. Range: 1-1024.'
      type: object
      required:
      - model
      - input
      title: EmbeddingsV5Request
      description: 'Jina Embeddings v5, with task-specific adapters and truncatable

        dimensions. Text, images, video, audio and PDFs share one vector space, so

        a query in any of them retrieves any other; the `omni` names are the ones

        to reach for when the corpus is not text.


        Each list item is one modality, except a `MergedContentGroup`

        (`{"content": [...]}`), which fuses several chunks into a single embedding

        in one forward pass.'
      examples:
      - dimensions: 512
        embedding_type: float
        input:
        - A beautiful sunset over the beach
        model: jina-embeddings-v5-text-small
        normalized: true
        task: retrieval.query
      - embedding_type: float
        input:
        - image: https://i.ibb.co/nQNGqL0/beach1.jpg
        - text: A beautiful sunset over the beach
        model: jina-embeddings-v5-omni-small
        task: retrieval.passage
    EmbeddingUsage:
      properties:
        total_tokens:
          type: integer
          title: Total Tokens
          description: Total number of tokens processed.
        prompt_tokens:
          type: integer
          title: Prompt Tokens
          description: Number of text input tokens. For multimodal responses the per-modality fields below account for non-text tokens; for text-only responses this equals `total_tokens`.
        image_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Image Tokens
          description: Number of tokens from image inputs.
        audio_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Audio Tokens
          description: Number of tokens from audio inputs.
        video_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Video Tokens
          description: Number of tokens from video inputs.
      type: object
      required:
      - total_tokens
      - prompt_tokens
      title: EmbeddingUsage
      description: "Token usage statistics for embedding requests.\n\n`prompt_tokens` counts text input tokens (including the task prefix and\nany structural/special framing). For text-only models — and any response\nthat doesn't populate a per-modality breakdown — it equals `total_tokens`.\nFor multimodal v5-omni responses, `total_tokens` is the aggregate across\nall modalities and the per-modality fields (`image_tokens` /\n`audio_tokens` / `video_tokens`) are sub-counts, so the invariant holds\nexactly (absent per-modality fields count as 0):\n\n    total_tokens == prompt_tokens + image_tokens + audio_tokens + video_tokens\n\nPDF pages are rendered to images and counted in `image_tokens`.\n\nAll MM fields are Optional so text-only responses don't have to populate\nthem, and serializers should drop unset fields (`exclude_none=True`)."
